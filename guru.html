<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard Guru — ClassRoom Lite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { primary: '#1a73e8' } } } };</script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Sidebar (fixed di desktop, drawer di mobile) -->
  <div id="drawer-overlay" class="drawer-overlay"></div>
  <aside id="sidebar" class="sidebar" aria-label="Menu utama">
    <div class="flex items-center gap-3 px-5 h-[3.75rem] border-b border-[#dadce0]">
      <span class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-[#1a73e8] text-white">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h7a3 3 0 0 1 3 3v14a2 2 0 0 0-2-2H2z"/><path d="M22 4h-7a3 3 0 0 0-3 3v14a2 2 0 0 1 2-2h8z"/></svg>
      </span>
      <span class="text-lg font-medium">ClassRoom Lite</span>
    </div>
    <nav id="nav" class="flex-1 py-3 overflow-y-auto"></nav>
    <div class="p-4 border-t border-[#dadce0] text-xs text-gray-500">Login sebagai <b id="side-role">Guru</b></div>
  </aside>

  <div class="main-area">
    <header class="sticky-header">
      <button id="btn-menu" class="btn-icon md:hidden" aria-label="Buka menu"></button>
      <h1 id="page-title" class="text-lg font-medium flex-1 truncate">Dashboard</h1>
      <div class="flex items-center gap-2">
        <span id="hdr-name" class="hidden sm:block text-sm text-gray-600"></span>
        <span id="hdr-avatar"></span>
      </div>
    </header>
    <main id="view" class="p-4 md:p-6 max-w-6xl mx-auto"></main>
  </div>

  <div id="toast-root"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/guru.js"></script>
</body>
</html>
