<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kelas Saya — ClassRoom Lite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { primary: '#1a73e8' } } } };</script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Top bar -->
  <header class="sticky-header" style="padding:0 1rem">
    <a href="#/" class="flex items-center gap-2.5 no-underline" style="color:inherit">
      <span class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-[#1a73e8] text-white">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h7a3 3 0 0 1 3 3v14a2 2 0 0 0-2-2H2z"/><path d="M22 4h-7a3 3 0 0 0-3 3v14a2 2 0 0 1 2-2h8z"/></svg>
      </span>
      <span class="text-lg font-medium hidden sm:inline">ClassRoom Lite</span>
    </a>
    <h1 id="page-title" class="text-base font-medium flex-1 truncate text-gray-600"></h1>
    <button id="btn-join" class="btn btn-outline btn-sm"></button>
    <div class="relative">
      <button id="btn-user" class="flex items-center gap-2 rounded-full hover:bg-gray-100 p-1 pr-2" aria-haspopup="true" aria-expanded="false">
        <span id="hdr-avatar"></span><span id="hdr-name" class="hidden sm:block text-sm"></span>
      </button>
      <div id="user-menu" class="hidden absolute right-0 mt-2 w-64 card p-2" style="z-index:50">
        <div class="px-3 py-2 border-b border-[#dadce0] mb-1"><p id="um-name" class="font-medium truncate"></p><p id="um-email" class="text-xs text-gray-500 truncate"></p></div>
        <button id="btn-logout" class="nav-item w-full text-left" style="margin-right:0;border-radius:.5rem"></button>
      </div>
    </div>
  </header>

  <main id="view" class="p-4 md:p-6 max-w-5xl mx-auto"></main>
  <div id="toast-root"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/siswa.js"></script>
</body>
</html>
